<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">图同构的直观表示</title>
  <desc id="desc">展示两个顶点标签不同但连接结构相同的图，以及保持邻接关系的双射。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .small { font-size: 18px; }
      .edge { stroke: #718096; stroke-width: 5; }
      .node-a { fill: #fecdd3; stroke: #d66778; stroke-width: 3; }
      .node-b { fill: #bfdbfe; stroke: #5e8fd3; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1100" height="500" rx="28" fill="#f8fafc"/>
  <text x="550" y="50" text-anchor="middle" class="zh title">图同构：标签可以改变，邻接结构不能改变</text>
  <line x1="150" y1="270" x2="290" y2="170" class="edge"/><line x1="290" y1="170" x2="430" y2="270" class="edge"/><line x1="430" y1="270" x2="290" y2="390" class="edge"/><line x1="290" y1="390" x2="150" y2="270" class="edge"/>
  <circle cx="150" cy="270" r="28" class="node-a"/><circle cx="290" cy="170" r="28" class="node-a"/><circle cx="430" cy="270" r="28" class="node-a"/><circle cx="290" cy="390" r="28" class="node-a"/>
  <text x="150" y="279" text-anchor="middle" class="zh label">a</text><text x="290" y="179" text-anchor="middle" class="zh label">b</text><text x="430" y="279" text-anchor="middle" class="zh label">c</text><text x="290" y="399" text-anchor="middle" class="zh label">d</text>
  <line x1="670" y1="270" x2="810" y2="170" class="edge"/><line x1="810" y1="170" x2="950" y2="270" class="edge"/><line x1="950" y1="270" x2="810" y2="390" class="edge"/><line x1="810" y1="390" x2="670" y2="270" class="edge"/>
  <circle cx="670" cy="270" r="28" class="node-b"/><circle cx="810" cy="170" r="28" class="node-b"/><circle cx="950" cy="270" r="28" class="node-b"/><circle cx="810" cy="390" r="28" class="node-b"/>
  <text x="670" y="279" text-anchor="middle" class="zh label">1</text><text x="810" y="179" text-anchor="middle" class="zh label">2</text><text x="950" y="279" text-anchor="middle" class="zh label">3</text><text x="810" y="399" text-anchor="middle" class="zh label">4</text>
  <path d="M460 270 H640" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="550" y="235" text-anchor="middle" class="zh label">φ</text>
  <text x="550" y="465" text-anchor="middle" class="zh small">φ(a)=1，φ(b)=2，φ(c)=3，φ(d)=4；φ 保持邻接关系</text>
</svg>

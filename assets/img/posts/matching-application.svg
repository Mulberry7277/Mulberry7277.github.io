<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">学生与项目的二分图匹配</title>
  <desc id="desc">左侧三个学生与右侧三个项目，红色匹配边给出互不冲突的分配方案。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.small{font-size:20px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#cbd5e1;stroke-width:5;stroke-linecap:round}.chosen{stroke:#e07a5f;stroke-width:9;stroke-linecap:round}.left{fill:#dbeafe;stroke:#3b82f6;stroke-width:3}.right{fill:#fef3c7;stroke:#d97706;stroke-width:3}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">二分图匹配把可行关系变成具体分配</text>
  <rect x="80" y="90" width="1040" height="455" rx="22" class="panel"/>
  <text x="280" y="150" text-anchor="middle" class="zh label">学生</text><text x="920" y="150" text-anchor="middle" class="zh label">项目</text>
  <line x1="300" y1="230" x2="900" y2="230" class="edge"/>
  <line x1="300" y1="230" x2="900" y2="330" class="edge"/>
  <line x1="300" y1="330" x2="900" y2="230" class="edge"/>
  <line x1="300" y1="330" x2="900" y2="430" class="edge"/>
  <line x1="300" y1="430" x2="900" y2="330" class="edge"/>
  <line x1="300" y1="430" x2="900" y2="430" class="edge"/>
  <line x1="300" y1="230" x2="900" y2="230" class="chosen"/>
  <line x1="300" y1="330" x2="900" y2="430" class="chosen"/>
  <line x1="300" y1="430" x2="900" y2="330" class="chosen"/>
  <circle cx="280" cy="230" r="29" class="left"/><circle cx="280" cy="330" r="29" class="left"/><circle cx="280" cy="430" r="29" class="left"/>
  <circle cx="920" cy="230" r="29" class="right"/><circle cx="920" cy="330" r="29" class="right"/><circle cx="920" cy="430" r="29" class="right"/>
  <text x="280" y="238" text-anchor="middle" class="zh small">甲</text><text x="280" y="338" text-anchor="middle" class="zh small">乙</text><text x="280" y="438" text-anchor="middle" class="zh small">丙</text>
  <text x="920" y="238" text-anchor="middle" class="zh small">A</text><text x="920" y="338" text-anchor="middle" class="zh small">B</text><text x="920" y="438" text-anchor="middle" class="zh small">C</text>
  <text x="600" y="505" text-anchor="middle" class="zh small">红色边：甲—A、乙—C、丙—B；每人和每个项目都恰好使用一次</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">最小生成树</title>
  <desc id="desc">带权图中，按较小权重选择不会形成圈的边，得到一棵最小生成树。</desc>
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 26px; font-weight: 700; }
      .small { font-size: 20px; }
      .edge { stroke: #cbd5e1; stroke-width: 6; stroke-linecap: round; }
      .keep { stroke: #e07a5f; stroke-width: 10; stroke-linecap: round; }
      .node { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .weight { fill: #1f2937; font-size: 21px; font-weight: 700; font-family: "Segoe UI", sans-serif; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .tag { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="54" text-anchor="middle" class="zh title">最小生成树：总成本最小的连通骨架</text>
  <rect x="42" y="90" width="780" height="470" rx="22" class="box"/>
  <text x="432" y="136" text-anchor="middle" class="zh label">从轻边开始，跳过会形成圈的边</text>
  <line x1="155" y1="320" x2="350" y2="175" class="edge"/><text x="245" y="220" class="weight">1</text>
  <line x1="350" y1="175" x2="545" y2="320" class="edge"/><text x="452" y="220" class="weight">2</text>
  <line x1="155" y1="320" x2="350" y2="465" class="edge"/><text x="225" y="425" class="weight">4</text>
  <line x1="350" y1="465" x2="545" y2="320" class="edge"/><text x="445" y="425" class="weight">3</text>
  <line x1="350" y1="175" x2="350" y2="465" class="edge"/><text x="365" y="325" class="weight">5</text>
  <line x1="545" y1="320" x2="735" y2="320" class="edge"/><text x="630" y="292" class="weight">1</text>
  <line x1="350" y1="465" x2="735" y2="320" class="edge"/><text x="555" y="445" class="weight">6</text>
  <line x1="350" y1="175" x2="735" y2="320" class="edge"/><text x="555" y="185" class="weight">7</text>
  <line x1="155" y1="320" x2="350" y2="175" class="keep"/><line x1="350" y1="175" x2="545" y2="320" class="keep"/><line x1="545" y1="320" x2="735" y2="320" class="keep"/><line x1="350" y1="465" x2="545" y2="320" class="keep"/>
  <circle cx="155" cy="320" r="28" class="node"/><circle cx="350" cy="175" r="28" class="node"/><circle cx="545" cy="320" r="28" class="node"/><circle cx="350" cy="465" r="28" class="node"/><circle cx="735" cy="320" r="28" class="node"/>
  <text x="155" y="328" text-anchor="middle" class="zh small">A</text><text x="350" y="183" text-anchor="middle" class="zh small">B</text><text x="545" y="328" text-anchor="middle" class="zh small">C</text><text x="350" y="473" text-anchor="middle" class="zh small">D</text><text x="735" y="328" text-anchor="middle" class="zh small">E</text>
  <text x="432" y="525" text-anchor="middle" class="zh small">保留权重 1、1、2、3：总权重为 7</text>
  <rect x="865" y="90" width="290" height="470" rx="22" class="box"/>
  <text x="1010" y="136" text-anchor="middle" class="zh label">选择过程</text>
  <rect x="900" y="180" width="220" height="60" rx="12" class="tag"/><text x="1010" y="218" text-anchor="middle" class="zh small">选 1：A—B</text>
  <rect x="900" y="260" width="220" height="60" rx="12" class="tag"/><text x="1010" y="298" text-anchor="middle" class="zh small">选 1：C—E</text>
  <rect x="900" y="340" width="220" height="60" rx="12" class="tag"/><text x="1010" y="378" text-anchor="middle" class="zh small">选 2：B—C</text>
  <rect x="900" y="420" width="220" height="60" rx="12" class="tag"/><text x="1010" y="458" text-anchor="middle" class="zh small">选 3：C—D</text>
</svg>

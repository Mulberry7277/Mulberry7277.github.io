<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">邻接矩阵与拉普拉斯矩阵</title>
  <desc id="desc">一张四顶点无向图对应邻接矩阵 A、度矩阵 D 和拉普拉斯矩阵 L。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:18px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:5;stroke-linecap:round}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.cell{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1}.cell2{fill:#fff7ed;stroke:#fed7aa;stroke-width:1}.matrix{font-family:"Segoe UI",sans-serif;font-size:21px;fill:#1f2937}
  </style></defs>
  <rect width="1400" height="650" rx="28" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" class="zh title">一张图可以被写成多个相互关联的矩阵</text>
  <rect x="35" y="95" width="430" height="480" rx="22" class="panel"/>
  <text x="250" y="140" text-anchor="middle" class="zh label">图 G</text>
  <line x1="125" y1="250" x2="265" y2="180" class="edge"/><line x1="125" y1="250" x2="265" y2="400" class="edge"/><line x1="265" y1="180" x2="265" y2="400" class="edge"/><line x1="265" y1="180" x2="395" y2="285" class="edge"/><line x1="265" y1="400" x2="395" y2="285" class="edge"/>
  <circle cx="125" cy="250" r="25" class="node"/><circle cx="265" cy="180" r="25" class="node"/><circle cx="265" cy="400" r="25" class="node"/><circle cx="395" cy="285" r="25" class="node"/>
  <text x="125" y="258" text-anchor="middle" class="zh small">1</text><text x="265" y="188" text-anchor="middle" class="zh small">2</text><text x="265" y="408" text-anchor="middle" class="zh small">3</text><text x="395" y="293" text-anchor="middle" class="zh small">4</text>
  <text x="250" y="510" text-anchor="middle" class="zh small">度数：2、3、3、2</text>
  <rect x="500" y="95" width="410" height="480" rx="22" class="panel"/><text x="705" y="140" text-anchor="middle" class="zh label">邻接矩阵 A</text>
  <text x="565" y="210" class="matrix">0  1  1  0</text><text x="565" y="275" class="matrix">1  0  1  1</text><text x="565" y="340" class="matrix">1  1  0  1</text><text x="565" y="405" class="matrix">0  1  1  0</text>
  <text x="705" y="500" text-anchor="middle" class="zh small">记录顶点—顶点的直接连接</text>
  <rect x="945" y="95" width="410" height="480" rx="22" class="panel"/><text x="1150" y="140" text-anchor="middle" class="zh label">拉普拉斯矩阵 L = D − A</text>
  <text x="1000" y="210" class="matrix"> 2  −1  −1   0</text><text x="1000" y="275" class="matrix">−1   3  −1  −1</text><text x="1000" y="340" class="matrix">−1  −1   3  −1</text><text x="1000" y="405" class="matrix"> 0  −1  −1   2</text>
  <text x="1150" y="500" text-anchor="middle" class="zh small">记录度数与邻接差异</text>
</svg>

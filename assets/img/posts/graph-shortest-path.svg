<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">带权图中的最短路径</title>
  <desc id="desc">展示带权图中从起点 s 到终点 t 的最短路径。</desc>
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .small { font-size: 18px; }
      .edge { stroke: #a0aec0; stroke-width: 5; }
      .short { stroke: #e07a5f; stroke-width: 8; }
      .node { fill: #fde68a; stroke: #c58b29; stroke-width: 3; }
      .weight { font-size: 19px; font-weight: 600; fill: #475569; }
    </style>
  </defs>
  <rect width="1100" height="560" rx="28" fill="#f8fafc"/>
  <text x="550" y="52" text-anchor="middle" class="zh title">最短路径：总权重最小的路径</text>
  <text x="550" y="92" text-anchor="middle" class="zh small">路径长度是经过边权的总和；红色路径从 s 到 t 的总权重为 7</text>

  <line x1="150" y1="300" x2="350" y2="180" class="short"/><line x1="350" y1="180" x2="560" y2="300" class="short"/><line x1="560" y1="300" x2="820" y2="210" class="short"/><line x1="820" y1="210" x2="970" y2="330" class="short"/>
  <line x1="150" y1="300" x2="350" y2="430" class="edge"/><line x1="350" y1="430" x2="560" y2="300" class="edge"/><line x1="560" y1="300" x2="820" y2="430" class="edge"/><line x1="820" y1="430" x2="970" y2="330" class="edge"/><line x1="350" y1="180" x2="820" y2="430" class="edge"/>
  <circle cx="150" cy="300" r="30" class="node"/><circle cx="350" cy="180" r="30" class="node"/><circle cx="350" cy="430" r="30" class="node"/><circle cx="560" cy="300" r="30" class="node"/><circle cx="820" cy="210" r="30" class="node"/><circle cx="820" cy="430" r="30" class="node"/><circle cx="970" cy="330" r="30" class="node"/>
  <text x="150" y="309" text-anchor="middle" class="zh label">s</text><text x="970" y="339" text-anchor="middle" class="zh label">t</text>
  <text x="250" y="220" class="weight">2</text><text x="450" y="220" class="weight">2</text><text x="685" y="235" class="weight">1</text><text x="895" y="260" class="weight">2</text><text x="250" y="390" class="weight">5</text><text x="450" y="390" class="weight">4</text><text x="685" y="390" class="weight">6</text><text x="895" y="410" class="weight">3</text><text x="590" y="405" class="weight">8</text>
  <text x="550" y="510" text-anchor="middle" class="zh small">最短路径问题需要同时考虑连接结构和边权；后续算法会讨论 BFS、Dijkstra 等方法</text>
</svg>

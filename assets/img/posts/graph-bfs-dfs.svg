<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">BFS 与 DFS 的访问顺序</title>
  <desc id="desc">同一张六顶点图中，广度优先搜索按层访问，深度优先搜索先走完一个分支再回退。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:5;stroke-linecap:round}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.bfs{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.dfs{fill:#fff7ed;stroke:#fdba74;stroke-width:2}
  </style></defs>
  <rect width="1200" height="650" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">同一张图：BFS 逐层，DFS 先深入</text>
  <rect x="55" y="95" width="605" height="500" rx="22" class="panel"/>
  <text x="357" y="140" text-anchor="middle" class="zh label">从 A 出发，邻居按字母顺序访问</text>
  <line x1="355" y1="205" x2="220" y2="315" class="edge"/><line x1="355" y1="205" x2="490" y2="315" class="edge"/>
  <line x1="220" y1="315" x2="135" y2="450" class="edge"/><line x1="220" y1="315" x2="305" y2="450" class="edge"/><line x1="490" y1="315" x2="490" y2="450" class="edge"/>
  <circle cx="355" cy="205" r="28" class="node"/><circle cx="220" cy="315" r="28" class="node"/><circle cx="490" cy="315" r="28" class="node"/><circle cx="135" cy="450" r="28" class="node"/><circle cx="305" cy="450" r="28" class="node"/><circle cx="490" cy="450" r="28" class="node"/>
  <text x="355" y="213" text-anchor="middle" class="zh small">A</text><text x="220" y="323" text-anchor="middle" class="zh small">B</text><text x="490" y="323" text-anchor="middle" class="zh small">C</text><text x="135" y="458" text-anchor="middle" class="zh small">D</text><text x="305" y="458" text-anchor="middle" class="zh small">E</text><text x="490" y="458" text-anchor="middle" class="zh small">F</text>
  <text x="355" y="545" text-anchor="middle" class="zh small">层次：A ｜ B、C ｜ D、E、F</text>
  <rect x="705" y="95" width="440" height="500" rx="22" class="panel"/>
  <rect x="750" y="180" width="350" height="130" rx="18" class="bfs"/>
  <text x="925" y="222" text-anchor="middle" class="zh label">BFS：队列</text>
  <text x="925" y="265" text-anchor="middle" class="zh small">A → B → C → D → E → F</text>
  <rect x="750" y="350" width="350" height="130" rx="18" class="dfs"/>
  <text x="925" y="392" text-anchor="middle" class="zh label">DFS：栈或递归</text>
  <text x="925" y="435" text-anchor="middle" class="zh small">A → B → D → E → C → F</text>
  <text x="925" y="540" text-anchor="middle" class="zh small">访问顺序随邻居顺序改变</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图的邻接矩阵和关联矩阵</title>
  <desc id="desc">左侧是四个顶点的图，右侧展示邻接矩阵和关联矩阵。</desc>
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .small { font-size: 18px; }
      .edge { stroke: #64748b; stroke-width: 5; }
      .node { fill: #fde68a; stroke: #c58b29; stroke-width: 3; }
      .cell { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; }
      .one { fill: #bfdbfe; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="zh title">图的矩阵表示：把连接结构写成数字表</text>

  <line x1="130" y1="260" x2="300" y2="180" class="edge"/><line x1="300" y1="180" x2="430" y2="300" class="edge"/><line x1="430" y1="300" x2="280" y2="430" class="edge"/><line x1="280" y1="430" x2="130" y2="260" class="edge"/><line x1="130" y1="260" x2="430" y2="300" class="edge"/>
  <circle cx="130" cy="260" r="28" class="node"/><circle cx="300" cy="180" r="28" class="node"/><circle cx="430" cy="300" r="28" class="node"/><circle cx="280" cy="430" r="28" class="node"/>
  <text x="130" y="269" text-anchor="middle" class="zh label">1</text><text x="300" y="189" text-anchor="middle" class="zh label">2</text><text x="430" y="309" text-anchor="middle" class="zh label">3</text><text x="280" y="439" text-anchor="middle" class="zh label">4</text>
  <text x="280" y="510" text-anchor="middle" class="zh label">G</text>

  <text x="620" y="120" class="zh label">邻接矩阵 A</text>
  <text x="620" y="150" class="zh small">Aᵢⱼ=1 表示 i 与 j 相邻</text>
  <g transform="translate(650,175)">
    <text x="78" y="-12" text-anchor="middle" class="zh small">1</text><text x="138" y="-12" text-anchor="middle" class="zh small">2</text><text x="198" y="-12" text-anchor="middle" class="zh small">3</text><text x="258" y="-12" text-anchor="middle" class="zh small">4</text>
    <text x="16" y="25" text-anchor="middle" class="zh small">1</text><text x="16" y="85" text-anchor="middle" class="zh small">2</text><text x="16" y="145" text-anchor="middle" class="zh small">3</text><text x="16" y="205" text-anchor="middle" class="zh small">4</text>
    <rect x="45" y="0" width="60" height="60" class="cell"/><rect x="105" y="0" width="60" height="60" class="cell one"/><rect x="165" y="0" width="60" height="60" class="cell one"/><rect x="225" y="0" width="60" height="60" class="cell one"/>
    <rect x="45" y="60" width="60" height="60" class="cell one"/><rect x="105" y="60" width="60" height="60" class="cell"/><rect x="165" y="60" width="60" height="60" class="cell one"/><rect x="225" y="60" width="60" height="60" class="cell"/>
    <rect x="45" y="120" width="60" height="60" class="cell one"/><rect x="105" y="120" width="60" height="60" class="cell one"/><rect x="165" y="120" width="60" height="60" class="cell"/><rect x="225" y="120" width="60" height="60" class="cell one"/>
    <rect x="45" y="180" width="60" height="60" class="cell one"/><rect x="105" y="180" width="60" height="60" class="cell"/><rect x="165" y="180" width="60" height="60" class="cell one"/><rect x="225" y="180" width="60" height="60" class="cell"/>
    <text x="75" y="38" text-anchor="middle" class="zh label">0</text><text x="135" y="38" text-anchor="middle" class="zh label">1</text><text x="195" y="38" text-anchor="middle" class="zh label">1</text><text x="255" y="38" text-anchor="middle" class="zh label">1</text>
    <text x="75" y="98" text-anchor="middle" class="zh label">1</text><text x="135" y="98" text-anchor="middle" class="zh label">0</text><text x="195" y="98" text-anchor="middle" class="zh label">1</text><text x="255" y="98" text-anchor="middle" class="zh label">0</text>
    <text x="75" y="158" text-anchor="middle" class="zh label">1</text><text x="135" y="158" text-anchor="middle" class="zh label">1</text><text x="195" y="158" text-anchor="middle" class="zh label">0</text><text x="255" y="158" text-anchor="middle" class="zh label">1</text>
    <text x="75" y="218" text-anchor="middle" class="zh label">1</text><text x="135" y="218" text-anchor="middle" class="zh label">0</text><text x="195" y="218" text-anchor="middle" class="zh label">1</text><text x="255" y="218" text-anchor="middle" class="zh label">0</text>
  </g>

  <text x="650" y="470" class="zh label">关联矩阵 B</text>
  <text x="650" y="500" class="zh small">行是顶点，列是边；端点位置填 1</text>
  <rect x="665" y="530" width="80" height="50" class="cell"/><rect x="745" y="530" width="80" height="50" class="cell"/><rect x="825" y="530" width="80" height="50" class="cell"/><rect x="905" y="530" width="80" height="50" class="cell"/>
  <text x="705" y="520" text-anchor="middle" class="zh small">e₁</text><text x="785" y="520" text-anchor="middle" class="zh small">e₂</text><text x="865" y="520" text-anchor="middle" class="zh small">e₃</text><text x="945" y="520" text-anchor="middle" class="zh small">e₄</text>
  <text x="625" y="563" class="zh small">顶点—边关联关系</text>
</svg>

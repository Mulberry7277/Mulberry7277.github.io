<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">考试排期的冲突图着色</title>
  <desc id="desc">课程 A、B、C 两两冲突，D 只与 C 冲突，颜色表示考试时段。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:25px;font-weight:700}.small{font-size:20px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:6;stroke-linecap:round}.s1{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.s2{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.s3{fill:#fef3c7;stroke:#d97706;stroke-width:3}.box{fill:#fff7ed;stroke:#fdba74;stroke-width:2}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" class="zh title">把考试冲突转成图着色问题</text>
  <rect x="70" y="95" width="720" height="445" rx="22" class="panel"/><text x="430" y="140" text-anchor="middle" class="zh label">冲突图</text>
  <line x1="260" y1="270" x2="600" y2="270" class="edge"/><line x1="260" y1="270" x2="430" y2="445" class="edge"/><line x1="600" y1="270" x2="430" y2="445" class="edge"/><line x1="600" y1="270" x2="690" y2="445" class="edge"/>
  <circle cx="260" cy="270" r="34" class="s1"/><circle cx="600" cy="270" r="34" class="s2"/><circle cx="430" cy="445" r="34" class="s3"/><circle cx="690" cy="445" r="34" class="s1"/>
  <text x="260" y="280" text-anchor="middle" class="zh label">A</text><text x="600" y="280" text-anchor="middle" class="zh label">B</text><text x="430" y="455" text-anchor="middle" class="zh label">C</text><text x="690" y="455" text-anchor="middle" class="zh label">D</text>
  <text x="430" y="505" text-anchor="middle" class="zh small">相邻表示有共同学生，不能同一时段考试</text>
  <rect x="850" y="95" width="300" height="445" rx="22" class="panel"/><text x="1000" y="140" text-anchor="middle" class="zh label">颜色 = 时段</text>
  <rect x="895" y="195" width="210" height="70" rx="14" class="s1"/><text x="1000" y="239" text-anchor="middle" class="zh small">时段 1：A、D</text>
  <rect x="895" y="295" width="210" height="70" rx="14" class="s2"/><text x="1000" y="339" text-anchor="middle" class="zh small">时段 2：B</text>
  <rect x="895" y="395" width="210" height="70" rx="14" class="s3"/><text x="1000" y="439" text-anchor="middle" class="zh small">时段 3：C</text>
</svg>

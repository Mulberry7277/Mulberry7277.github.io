<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">量词否定规则</title>
  <desc id="desc">全称量词和存在量词在否定时相互转换。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9a6b3f"/>
    </marker>
    <style>
      .zh { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #2d3748; }
      .title { font-size: 28px; font-weight: 700; }
      .formula { font-size: 30px; font-weight: 700; }
      .note { font-size: 20px; }
      .box { stroke: #c9a77b; stroke-width: 2; rx: 20; }
    </style>
  </defs>
  <rect width="1100" height="470" rx="28" fill="url(#bg)"/>
  <text x="550" y="52" text-anchor="middle" class="zh title">量词的否定：全称与存在相互转换</text>

  <rect x="70" y="115" width="420" height="120" class="box" fill="#fff"/>
  <text x="280" y="165" text-anchor="middle" class="zh formula">¬(∀x P(x))</text>
  <text x="280" y="205" text-anchor="middle" class="zh note">并非所有 x 都满足 P</text>

  <rect x="610" y="115" width="420" height="120" class="box" fill="#fff"/>
  <text x="820" y="165" text-anchor="middle" class="zh formula">∃x ¬P(x)</text>
  <text x="820" y="205" text-anchor="middle" class="zh note">至少有一个 x 不满足 P</text>
  <path d="M500 175 H600" stroke="#9a6b3f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 195 H500" stroke="#9a6b3f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="550" y="158" text-anchor="middle" class="zh note">等价</text>

  <rect x="70" y="290" width="420" height="120" class="box" fill="#fff"/>
  <text x="280" y="340" text-anchor="middle" class="zh formula">¬(∃x P(x))</text>
  <text x="280" y="380" text-anchor="middle" class="zh note">不存在满足 P 的 x</text>

  <rect x="610" y="290" width="420" height="120" class="box" fill="#fff"/>
  <text x="820" y="340" text-anchor="middle" class="zh formula">∀x ¬P(x)</text>
  <text x="820" y="380" text-anchor="middle" class="zh note">所有 x 都不满足 P</text>
  <path d="M500 350 H600" stroke="#9a6b3f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 370 H500" stroke="#9a6b3f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="550" y="333" text-anchor="middle" class="zh note">等价</text>
</svg>

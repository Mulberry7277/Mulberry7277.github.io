<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">交叉画法与平面嵌入</title>
  <desc id="desc">同一个四顶点完全图在左侧画法中两条对角线相交，右侧将一个顶点移入三角形后没有边交叉。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#8193ad;stroke-width:6;stroke-linecap:round}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.cross{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">一幅画有交叉，不代表这张图不能画成平面图</text>
  <rect x="40" y="95" width="530" height="440" rx="22" class="panel"/>
  <text x="305" y="140" text-anchor="middle" class="zh label">交叉的画法</text>
  <line x1="160" y1="210" x2="450" y2="210" class="edge"/><line x1="450" y1="210" x2="450" y2="425" class="edge"/><line x1="450" y1="425" x2="160" y2="425" class="edge"/><line x1="160" y1="425" x2="160" y2="210" class="edge"/>
  <line x1="160" y1="210" x2="450" y2="425" class="edge"/><line x1="450" y1="210" x2="160" y2="425" class="edge"/>
  <circle cx="305" cy="318" r="13" class="cross"/>
  <circle cx="160" cy="210" r="27" class="node"/><circle cx="450" cy="210" r="27" class="node"/><circle cx="450" cy="425" r="27" class="node"/><circle cx="160" cy="425" r="27" class="node"/>
  <text x="160" y="218" text-anchor="middle" class="zh small">A</text><text x="450" y="218" text-anchor="middle" class="zh small">B</text><text x="450" y="433" text-anchor="middle" class="zh small">C</text><text x="160" y="433" text-anchor="middle" class="zh small">D</text>
  <text x="305" y="490" text-anchor="middle" class="zh small">两条对角线在内部相交</text>
  <rect x="630" y="95" width="530" height="440" rx="22" class="panel"/>
  <text x="895" y="140" text-anchor="middle" class="zh label">同一张 K₄ 的平面嵌入</text>
  <line x1="895" y1="190" x2="1055" y2="420" class="edge"/><line x1="1055" y1="420" x2="735" y2="420" class="edge"/><line x1="735" y1="420" x2="895" y2="190" class="edge"/>
  <line x1="895" y1="190" x2="895" y2="335" class="edge"/><line x1="1055" y1="420" x2="895" y2="335" class="edge"/><line x1="735" y1="420" x2="895" y2="335" class="edge"/>
  <circle cx="895" cy="190" r="27" class="node"/><circle cx="1055" cy="420" r="27" class="node"/><circle cx="735" cy="420" r="27" class="node"/><circle cx="895" cy="335" r="27" class="node"/>
  <text x="895" y="198" text-anchor="middle" class="zh small">A</text><text x="1055" y="428" text-anchor="middle" class="zh small">B</text><text x="735" y="428" text-anchor="middle" class="zh small">C</text><text x="895" y="343" text-anchor="middle" class="zh small">D</text>
  <text x="895" y="490" text-anchor="middle" class="zh small">移动顶点后，边只在端点相遇</text>
</svg>

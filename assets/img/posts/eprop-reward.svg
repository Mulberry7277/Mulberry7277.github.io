<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">奖励型 e-prop 的 actor-critic 更新</title>
  <desc id="desc">策略网络产生动作，环境返回奖励，价值网络计算时间差分误差，误差调制策略神经元的学习信号与局部资格迹。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#26344a}.h{font-size:31px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:18px}.arr{fill:none;stroke:#66778f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66778f"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d9794b"/></marker>
  </defs>
  <rect width="1100" height="520" rx="25" fill="#f8fafc"/>
  <text x="550" y="56" text-anchor="middle" class="t h">奖励型 e-prop：TD 误差调制局部资格迹</text>
  <rect x="45" y="115" width="220" height="115" rx="20" fill="#deedfd" stroke="#75a7d8" stroke-width="2"/>
  <text x="155" y="160" text-anchor="middle" class="t l">状态输入</text><text x="155" y="192" text-anchor="middle" class="t s">感觉或视觉脉冲</text>
  <rect x="340" y="95" width="255" height="155" rx="20" fill="#e7f5ec" stroke="#79b493" stroke-width="2"/>
  <text x="468" y="140" text-anchor="middle" class="t l">策略网络 Actor</text><text x="468" y="174" text-anchor="middle" class="t s">输出动作与局部资格迹</text><text x="468" y="207" text-anchor="middle" class="t s">L(t) × e(t)</text>
  <rect x="705" y="115" width="205" height="115" rx="20" fill="#fff0df" stroke="#e5b174" stroke-width="2"/>
  <text x="807" y="160" text-anchor="middle" class="t l">环境</text><text x="807" y="192" text-anchor="middle" class="t s">动作 → 奖励 r(t)</text>
  <path d="M265 172 L332 172" class="arr" marker-end="url(#a)"/><path d="M595 172 L697 172" class="arr" marker-end="url(#a)"/><path d="M807 236 C807 310 468 310 468 258" class="arr" marker-end="url(#a)"/>
  <rect x="340" y="333" width="255" height="105" rx="20" fill="#fcebe7" stroke="#dfaa9b" stroke-width="2"/>
  <text x="468" y="374" text-anchor="middle" class="t l">Critic：V(t)</text><text x="468" y="408" text-anchor="middle" class="t s">δ(t)=r(t)+γV(t+1)−V(t)</text>
  <path d="M807 236 C965 300 698 375 605 385" class="arr" stroke="#d9794b" marker-end="url(#o)"/>
  <path d="M340 385 L265 385 L265 230" class="arr" stroke="#d9794b" marker-end="url(#o)"/>
  <text x="811" y="310" class="t s" fill="#d9794b">奖励预测误差 δ(t)</text>
  <text x="142" y="382" class="t s" fill="#d9794b">调制 Actor 的更新</text>
  <rect x="695" y="349" width="292" height="77" rx="16" fill="#fff" stroke="#d4deea" stroke-width="2"/>
  <text x="841" y="381" text-anchor="middle" class="t l">Δw ∝ −η δ(t)L(t)e(t)</text><text x="841" y="408" text-anchor="middle" class="t s">概念形式；论文还包含折扣和滤波</text>
</svg>

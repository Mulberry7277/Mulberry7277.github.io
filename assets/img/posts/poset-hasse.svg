<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">偏序关系的 Hasse 图</title>
  <desc id="desc">展示集合 {1,2,3,6} 上的整除偏序关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 19px; }
      .edge { stroke: #65758a; stroke-width: 4; }
      .node { fill: #ffffff; stroke: #667f9d; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1100" height="600" rx="28" fill="url(#bg)"/>
  <text x="550" y="52" text-anchor="middle" class="zh title">偏序关系：用 Hasse 图省略自反和传递边</text>
  <text x="550" y="92" text-anchor="middle" class="zh small">在 {1,2,3,6} 上定义 a≼b ⇔ a 整除 b</text>

  <line x1="550" y1="180" x2="350" y2="330" class="edge"/>
  <line x1="550" y1="180" x2="750" y2="330" class="edge"/>
  <line x1="350" y1="330" x2="550" y2="480" class="edge"/>
  <line x1="750" y1="330" x2="550" y2="480" class="edge"/>

  <circle cx="550" cy="155" r="45" class="node" fill="#fde68a"/>
  <circle cx="350" cy="330" r="45" class="node" fill="#dbeafe"/>
  <circle cx="750" cy="330" r="45" class="node" fill="#dbeafe"/>
  <circle cx="550" cy="505" r="45" class="node" fill="#bbf7d0"/>
  <text x="550" y="164" text-anchor="middle" class="zh label">1</text>
  <text x="350" y="339" text-anchor="middle" class="zh label">2</text>
  <text x="750" y="339" text-anchor="middle" class="zh label">3</text>
  <text x="550" y="514" text-anchor="middle" class="zh label">6</text>

  <text x="825" y="180" class="zh small">向上表示“被整除”</text>
  <text x="825" y="215" class="zh small">1≼2，1≼3，2≼6，3≼6</text>
  <text x="825" y="250" class="zh small">1≼6 由传递性得到</text>
  <text x="550" y="570" text-anchor="middle" class="zh small">边表示覆盖关系；自反边和传递边不直接画出</text>
</svg>

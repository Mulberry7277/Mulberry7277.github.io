<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">三类网络模型比较</title>
  <desc id="desc">规则网络、随机网络和具有社区与枢纽的复杂网络示意。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:18px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:4;stroke-linecap:round}.hub{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.node2{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.node3{fill:#fef3c7;stroke:#d97706;stroke-width:2}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="600" y="54" text-anchor="middle" class="zh title">网络模型：从规则、随机到复杂结构</text>
  <rect x="35" y="95" width="350" height="450" rx="22" class="panel"/><text x="210" y="140" text-anchor="middle" class="zh label">规则网络</text>
  <circle cx="210" cy="320" r="125" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M210 195 L298 232 L335 320 L298 408 L210 445 L122 408 L85 320 L122 232 Z" fill="none" class="edge"/>
  <path d="M210 195 L335 320 L210 445 L85 320 Z" fill="none" class="edge"/>
  <circle cx="210" cy="195" r="14" class="node"/><circle cx="298" cy="232" r="14" class="node"/><circle cx="335" cy="320" r="14" class="node"/><circle cx="298" cy="408" r="14" class="node"/><circle cx="210" cy="445" r="14" class="node"/><circle cx="122" cy="408" r="14" class="node"/><circle cx="85" cy="320" r="14" class="node"/><circle cx="122" cy="232" r="14" class="node"/>
  <text x="210" y="500" text-anchor="middle" class="zh small">连接规则、局部结构重复</text>
  <rect x="425" y="95" width="350" height="450" rx="22" class="panel"/><text x="600" y="140" text-anchor="middle" class="zh label">随机图</text>
  <line x1="480" y1="235" x2="570" y2="190" class="edge"/><line x1="480" y1="235" x2="665" y2="235" class="edge"/><line x1="480" y1="235" x2="555" y2="365" class="edge"/><line x1="570" y1="190" x2="690" y2="400" class="edge"/><line x1="570" y1="190" x2="555" y2="365" class="edge"/><line x1="665" y1="235" x2="690" y2="400" class="edge"/><line x1="665" y1="235" x2="555" y2="365" class="edge"/><line x1="555" y1="365" x2="690" y2="400" class="edge"/>
  <circle cx="480" cy="235" r="15" class="node2"/><circle cx="570" cy="190" r="15" class="node2"/><circle cx="665" cy="235" r="15" class="node2"/><circle cx="555" cy="365" r="15" class="node2"/><circle cx="690" cy="400" r="15" class="node2"/>
  <text x="600" y="500" text-anchor="middle" class="zh small">每条潜在边按概率独立出现</text>
  <rect x="815" y="95" width="350" height="450" rx="22" class="panel"/><text x="990" y="140" text-anchor="middle" class="zh label">复杂网络</text>
  <line x1="860" y1="245" x2="930" y2="205" class="edge"/><line x1="860" y1="245" x2="930" y2="350" class="edge"/><line x1="860" y1="245" x2="1060" y2="225" class="edge"/><line x1="930" y1="205" x2="930" y2="350" class="edge"/><line x1="930" y1="205" x2="1060" y2="225" class="edge"/><line x1="930" y1="350" x2="1060" y2="225" class="edge"/><line x1="1060" y1="225" x2="1100" y2="400" class="edge"/><line x1="930" y1="350" x2="1100" y2="400" class="edge"/>
  <circle cx="860" cy="245" r="15" class="node3"/><circle cx="930" cy="205" r="15" class="node3"/><circle cx="930" cy="350" r="15" class="node3"/><circle cx="1060" cy="225" r="27" class="hub"/><circle cx="1100" cy="400" r="15" class="node3"/>
  <text x="990" y="500" text-anchor="middle" class="zh small">社区、捷径与少数 hub 同时存在</text>
</svg>

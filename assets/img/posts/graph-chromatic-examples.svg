<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">常见图的色数</title>
  <desc id="desc">偶圈需要两种颜色，奇圈需要三种颜色，完全图 K4 需要四种颜色。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#64748b;stroke-width:5}.n1{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.n2{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.n3{fill:#fef3c7;stroke:#d97706;stroke-width:3}.n4{fill:#fce7f3;stroke:#db2777;stroke-width:3}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">色数：相邻顶点不能同色，颜色尽量少</text>
  <rect x="35" y="95" width="350" height="450" rx="22" class="panel"/><text x="210" y="140" text-anchor="middle" class="zh label">偶圈 C₄：χ = 2</text>
  <line x1="125" y1="250" x2="295" y2="250" class="edge"/><line x1="295" y1="250" x2="295" y2="390" class="edge"/><line x1="295" y1="390" x2="125" y2="390" class="edge"/><line x1="125" y1="390" x2="125" y2="250" class="edge"/>
  <circle cx="125" cy="250" r="25" class="n1"/><circle cx="295" cy="250" r="25" class="n2"/><circle cx="295" cy="390" r="25" class="n1"/><circle cx="125" cy="390" r="25" class="n2"/><text x="210" y="485" text-anchor="middle" class="zh small">沿圈交替使用两色</text>
  <rect x="425" y="95" width="350" height="450" rx="22" class="panel"/><text x="600" y="140" text-anchor="middle" class="zh label">奇圈 C₅：χ = 3</text>
  <polygon points="600,205 735,305 685,465 515,465 465,305" fill="none" class="edge"/>
  <circle cx="600" cy="205" r="25" class="n1"/><circle cx="735" cy="305" r="25" class="n2"/><circle cx="685" cy="465" r="25" class="n1"/><circle cx="515" cy="465" r="25" class="n2"/><circle cx="465" cy="305" r="25" class="n3"/><text x="600" y="510" text-anchor="middle" class="zh small">两色交替到最后会冲突</text>
  <rect x="815" y="95" width="350" height="450" rx="22" class="panel"/><text x="990" y="140" text-anchor="middle" class="zh label">完全图 K₄：χ = 4</text>
  <line x1="900" y1="245" x2="1080" y2="245" class="edge"/><line x1="1080" y1="245" x2="1080" y2="420" class="edge"/><line x1="1080" y1="420" x2="900" y2="420" class="edge"/><line x1="900" y1="420" x2="900" y2="245" class="edge"/><line x1="900" y1="245" x2="1080" y2="420" class="edge"/><line x1="1080" y1="245" x2="900" y2="420" class="edge"/>
  <circle cx="900" cy="245" r="25" class="n1"/><circle cx="1080" cy="245" r="25" class="n2"/><circle cx="1080" cy="420" r="25" class="n3"/><circle cx="900" cy="420" r="25" class="n4"/><text x="990" y="485" text-anchor="middle" class="zh small">任意两点相邻，必须四色</text>
</svg>

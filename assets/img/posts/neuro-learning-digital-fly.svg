<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">果蝇数字生命的学习闭环</title>
  <desc id="desc">环境刺激进入感觉通路，连接组约束的神经回路产生动作，动作又改变环境；奖励或误差信号作用于可塑突触，支持下一轮学习。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#26344a}.h{font-size:31px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:17px}.arr{fill:none;stroke:#65758b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.learn{stroke:#d77c50;stroke-dasharray:9 8}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#65758b"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d77c50"/></marker>
  </defs>
  <rect width="1100" height="520" rx="25" fill="#f8fafc"/>
  <text x="550" y="58" text-anchor="middle" class="t h">从可运行回路到可学习的数字生命</text>
  <rect x="44" y="139" width="206" height="116" rx="21" fill="#e7f3ff" stroke="#87b5db" stroke-width="2"/>
  <text x="147" y="187" text-anchor="middle" class="t l">环境</text><text x="147" y="219" text-anchor="middle" class="t s">气味、食物、惩罚</text>
  <rect x="306" y="139" width="206" height="116" rx="21" fill="#e7f3ff" stroke="#87b5db" stroke-width="2"/>
  <text x="409" y="187" text-anchor="middle" class="t l">感觉输入</text><text x="409" y="219" text-anchor="middle" class="t s">激活神经回路</text>
  <rect x="568" y="139" width="238" height="116" rx="21" fill="#e8f5eb" stroke="#84ba93" stroke-width="2"/>
  <text x="687" y="187" text-anchor="middle" class="t l">连接组约束回路</text><text x="687" y="219" text-anchor="middle" class="t s">动力学 + 可塑突触</text>
  <rect x="862" y="139" width="195" height="116" rx="21" fill="#e7f3ff" stroke="#87b5db" stroke-width="2"/>
  <text x="959" y="187" text-anchor="middle" class="t l">身体动作</text><text x="959" y="219" text-anchor="middle" class="t s">改变环境</text>
  <path d="M250 197 L295 197 M512 197 L557 197 M806 197 L851 197" class="arr" marker-end="url(#a)"/>
  <path d="M959 256 L959 319 Q959 345 930 345 L158 345 Q147 345 147 316 L147 267" class="arr" marker-end="url(#a)"/>
  <text x="344" y="332" class="t s">动作后的感觉反馈：下一轮输入</text>
  <rect x="508" y="384" width="359" height="82" rx="19" fill="#fff0e5" stroke="#e4ad8a" stroke-width="2"/>
  <text x="687" y="417" text-anchor="middle" class="t l">奖励 / 预测误差 / 神经调质</text>
  <text x="687" y="445" text-anchor="middle" class="t s">决定哪些资格迹转化为突触更新</text>
  <path d="M687 384 L687 267" class="arr learn" marker-end="url(#b)"/>
  <text x="335" y="466" class="t s">结构提供约束</text><text x="865" y="466" class="t s">经验驱动学习</text>
</svg>

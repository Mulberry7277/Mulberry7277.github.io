<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">前瞻性配置适合的学习情境</title>
  <desc id="desc">前瞻性配置在在线学习、持续学习、概念漂移、小样本学习和强化学习中减少干扰并提高适应性。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#26344a}.h{font-size:31px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:17px}.arr{fill:none;stroke:#66778f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#66778f"/></marker>
  </defs>
  <rect width="1120" height="560" rx="25" fill="#f8fafc"/>
  <text x="560" y="54" text-anchor="middle" class="t h">前瞻性配置的应用场景</text>
  <g transform="translate(55,105)">
    <rect width="300" height="155" rx="20" fill="#deedfd" stroke="#75a7d8" stroke-width="2"/><text x="150" y="45" text-anchor="middle" class="t l">在线学习</text><text x="150" y="83" text-anchor="middle" class="t s">每个样本到来后立即更新</text><path d="M75 120 L225 120" class="arr" marker-end="url(#a)"/><circle cx="75" cy="120" r="8" fill="#357fb7"/><circle cx="125" cy="120" r="8" fill="#357fb7"/><circle cx="175" cy="120" r="8" fill="#357fb7"/>
  </g>
  <g transform="translate(410,105)">
    <rect width="300" height="155" rx="20" fill="#e7f5ec" stroke="#79b493" stroke-width="2"/><text x="150" y="45" text-anchor="middle" class="t l">持续学习</text><text x="150" y="83" text-anchor="middle" class="t s">保留旧任务，学习新任务</text><path d="M80 120 L220 120" stroke="#357fb7" stroke-width="6"/><path d="M110 105 L110 135 M160 105 L160 135 M210 105 L210 135" stroke="#d9794b" stroke-width="4"/>
  </g>
  <g transform="translate(765,105)">
    <rect width="300" height="155" rx="20" fill="#fff0df" stroke="#e5b174" stroke-width="2"/><text x="150" y="45" text-anchor="middle" class="t l">概念漂移</text><text x="150" y="83" text-anchor="middle" class="t s">环境映射逐渐改变</text><path d="M75 125 C115 80 150 150 190 100 S250 85 230 135" fill="none" stroke="#d9794b" stroke-width="5"/>
  </g>
  <g transform="translate(230,330)">
    <rect width="300" height="155" rx="20" fill="#fcebe7" stroke="#dfaa9b" stroke-width="2"/><text x="150" y="45" text-anchor="middle" class="t l">小样本学习</text><text x="150" y="83" text-anchor="middle" class="t s">少量经历也要稳定更新</text><circle cx="90" cy="120" r="10" fill="#d9794b"/><circle cx="150" cy="120" r="10" fill="#d9794b"/><circle cx="210" cy="120" r="10" fill="#d9794b"/>
  </g>
  <g transform="translate(590,330)">
    <rect width="300" height="155" rx="20" fill="#e9e5f7" stroke="#9b89c8" stroke-width="2"/><text x="150" y="45" text-anchor="middle" class="t l">强化学习</text><text x="150" y="83" text-anchor="middle" class="t s">反馈先改变潜在状态</text><path d="M80 125 L150 95 L220 125" class="arr" marker-end="url(#a)"/><circle cx="150" cy="95" r="9" fill="#9b89c8"/>
  </g>
  <text x="560" y="530" text-anchor="middle" class="t s">共同特点：权重修改前先观察并补偿潜在的活动副作用</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">连通图、连通分支、桥与割点</title>
  <desc id="desc">展示连通分支以及删除桥或割点后图被分开的现象。</desc>
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .small { font-size: 18px; }
      .edge { stroke: #718096; stroke-width: 5; stroke-linecap: round; }
      .bridge { stroke: #e07a5f; stroke-width: 8; stroke-linecap: round; }
      .node-a { fill: #fecdd3; stroke: #d66778; stroke-width: 3; }
      .node-b { fill: #bfdbfe; stroke: #5e8fd3; stroke-width: 3; }
      .cut { fill: #f6c453; stroke: #c79527; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="600" rx="28" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="zh title">连通性：能否沿图中的边到达另一个顶点</text>

  <text x="280" y="110" text-anchor="middle" class="zh label">连通图</text>
  <line x1="140" y1="270" x2="250" y2="180" class="edge"/><line x1="250" y1="180" x2="400" y2="240" class="edge"/><line x1="140" y1="270" x2="250" y2="370" class="edge"/><line x1="250" y1="370" x2="400" y2="240" class="edge"/><line x1="250" y1="180" x2="250" y2="370" class="edge"/>
  <circle cx="140" cy="270" r="24" class="node-a"/><circle cx="250" cy="180" r="24" class="node-a"/><circle cx="400" cy="240" r="24" class="node-a"/><circle cx="250" cy="370" r="24" class="node-a"/>
  <text x="280" y="475" text-anchor="middle" class="zh small">任意两个顶点之间都有路径</text>

  <text x="600" y="110" text-anchor="middle" class="zh label">两个连通分支</text>
  <line x1="485" y1="210" x2="570" y2="160" class="edge"/><line x1="485" y1="210" x2="570" y2="270" class="edge"/><line x1="570" y1="160" x2="570" y2="270" class="edge"/>
  <line x1="720" y1="210" x2="805" y2="160" class="edge"/><line x1="720" y1="210" x2="805" y2="270" class="edge"/><line x1="805" y1="160" x2="805" y2="270" class="edge"/>
  <circle cx="485" cy="210" r="22" class="node-a"/><circle cx="570" cy="160" r="22" class="node-a"/><circle cx="570" cy="270" r="22" class="node-a"/><circle cx="720" cy="210" r="22" class="node-b"/><circle cx="805" cy="160" r="22" class="node-b"/><circle cx="805" cy="270" r="22" class="node-b"/>
  <text x="635" y="475" text-anchor="middle" class="zh small">图被分成两个极大的连通子图</text>

  <text x="950" y="110" text-anchor="middle" class="zh label">桥与割点</text>
  <line x1="900" y1="210" x2="960" y2="210" class="bridge"/><line x1="960" y1="210" x2="1030" y2="160" class="edge"/><line x1="960" y1="210" x2="1030" y2="260" class="edge"/><line x1="1030" y1="160" x2="1030" y2="260" class="edge"/>
  <circle cx="900" cy="210" r="22" class="node-a"/><circle cx="960" cy="210" r="25" class="cut"/><circle cx="1030" cy="160" r="22" class="node-b"/><circle cx="1030" cy="260" r="22" class="node-b"/>
  <text x="960" y="215" text-anchor="middle" class="zh label">v</text>
  <text x="950" y="350" text-anchor="middle" class="zh small">红边是桥：删除后图断开</text>
  <text x="950" y="385" text-anchor="middle" class="zh small">黄色顶点是割点：删除后图断开</text>

  <text x="600" y="550" text-anchor="middle" class="zh small">连通性把局部连接结构与整体可达性联系起来</text>
</svg>

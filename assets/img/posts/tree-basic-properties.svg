<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">树的基本结构与性质</title>
  <desc id="desc">一棵没有圈的树，以及树的唯一路径、桥和叶顶点性质。</desc>
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 20px; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .edge { stroke: #94a3b8; stroke-width: 6; stroke-linecap: round; }
      .path { stroke: #e07a5f; stroke-width: 9; stroke-linecap: round; fill: none; }
      .node { fill: #dbeafe; stroke: #3b82f6; stroke-width: 3; }
      .leaf { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .accent { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="54" text-anchor="middle" class="zh title">树：连通、无圈，且任意两点之间只有一条路径</text>

  <rect x="45" y="92" width="610" height="470" rx="22" class="panel"/>
  <text x="350" y="138" text-anchor="middle" class="zh label">一棵树的结构</text>
  <line x1="350" y1="205" x2="205" y2="315" class="edge"/>
  <line x1="350" y1="205" x2="350" y2="315" class="edge"/>
  <line x1="350" y1="205" x2="495" y2="315" class="edge"/>
  <line x1="205" y1="315" x2="135" y2="445" class="edge"/>
  <line x1="205" y1="315" x2="275" y2="445" class="edge"/>
  <line x1="495" y1="315" x2="565" y2="445" class="edge"/>
  <path d="M135 445 L205 315 L350 205 L495 315 L565 445" class="path"/>
  <circle cx="350" cy="205" r="25" class="node"/>
  <circle cx="205" cy="315" r="25" class="node"/>
  <circle cx="350" cy="315" r="25" class="node"/>
  <circle cx="495" cy="315" r="25" class="node"/>
  <circle cx="135" cy="445" r="25" class="leaf"/>
  <circle cx="275" cy="445" r="25" class="leaf"/>
  <circle cx="565" cy="445" r="25" class="leaf"/>
  <text x="350" y="515" text-anchor="middle" class="zh small">红色路线是两个端点之间唯一的简单路径</text>

  <rect x="700" y="92" width="455" height="470" rx="22" class="panel"/>
  <text x="927" y="138" text-anchor="middle" class="zh label">三条核心性质</text>
  <rect x="745" y="180" width="365" height="78" rx="14" class="accent"/>
  <text x="927" y="214" text-anchor="middle" class="zh small">任意两点之间恰好一条路径</text>
  <text x="927" y="242" text-anchor="middle" class="zh small">没有多余的闭环</text>
  <rect x="745" y="286" width="365" height="78" rx="14" class="accent"/>
  <text x="927" y="320" text-anchor="middle" class="zh small">删去任意一条边都会断开</text>
  <text x="927" y="348" text-anchor="middle" class="zh small">每条边都是桥</text>
  <rect x="745" y="392" width="365" height="96" rx="14" class="accent"/>
  <text x="927" y="428" text-anchor="middle" class="zh small">若有 n 个顶点</text>
  <text x="927" y="460" text-anchor="middle" class="zh small">就有 n − 1 条边</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">集合的基本运算</title>
  <desc id="desc">用四个韦恩图展示并集、交集、差集和补集。</desc>
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .note { font-size: 18px; }
      .panel { fill: #ffffff; stroke: #d3dce8; stroke-width: 2; }
      .circle-a { fill: #f28b82; fill-opacity: .72; stroke: #c65d56; stroke-width: 2; }
      .circle-b { fill: #78a9ed; fill-opacity: .72; stroke: #4d7fc8; stroke-width: 2; }
      .highlight { fill: #f6c453; fill-opacity: .9; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" class="zh title">集合的基本运算：由成员关系决定区域</text>

  <rect x="50" y="85" width="530" height="245" rx="18" class="panel"/>
  <text x="315" y="125" text-anchor="middle" class="zh label">并集 A ∪ B</text>
  <ellipse cx="260" cy="220" rx="145" ry="75" class="circle-a"/>
  <ellipse cx="365" cy="220" rx="145" ry="75" class="circle-b"/>
  <text x="210" y="220" text-anchor="middle" class="zh note">A</text>
  <text x="415" y="220" text-anchor="middle" class="zh note">B</text>
  <text x="315" y="302" text-anchor="middle" class="zh note">属于 A 或 B 的元素</text>

  <rect x="620" y="85" width="530" height="245" rx="18" class="panel"/>
  <text x="885" y="125" text-anchor="middle" class="zh label">交集 A ∩ B</text>
  <ellipse cx="830" cy="220" rx="145" ry="75" class="circle-a"/>
  <ellipse cx="935" cy="220" rx="145" ry="75" class="circle-b"/>
  <ellipse cx="882" cy="220" rx="40" ry="74" class="highlight"/>
  <text x="780" y="220" text-anchor="middle" class="zh note">A</text>
  <text x="985" y="220" text-anchor="middle" class="zh note">B</text>
  <text x="885" y="302" text-anchor="middle" class="zh note">同时属于 A 和 B 的元素</text>

  <rect x="50" y="375" width="530" height="245" rx="18" class="panel"/>
  <text x="315" y="415" text-anchor="middle" class="zh label">差集 A ∖ B</text>
  <ellipse cx="260" cy="510" rx="145" ry="75" fill="#f6c453" fill-opacity=".9" stroke="#c79527" stroke-width="2"/>
  <ellipse cx="365" cy="510" rx="145" ry="75" class="circle-b"/>
  <ellipse cx="365" cy="510" rx="40" ry="74" fill="#78a9ed" fill-opacity=".9"/>
  <text x="210" y="510" text-anchor="middle" class="zh note">只在 A 中</text>
  <text x="415" y="510" text-anchor="middle" class="zh note">B</text>
  <text x="315" y="592" text-anchor="middle" class="zh note">属于 A 但不属于 B</text>

  <rect x="620" y="375" width="530" height="245" rx="18" class="panel"/>
  <text x="885" y="415" text-anchor="middle" class="zh label">补集 Aᶜ（相对于 U）</text>
  <rect x="735" y="455" width="300" height="115" rx="14" fill="#dbeafe" stroke="#5b8def" stroke-width="2"/>
  <ellipse cx="885" cy="512" rx="78" ry="38" fill="#f6c453" stroke="#c79527" stroke-width="2"/>
  <text x="885" y="520" text-anchor="middle" class="zh note">A</text>
  <text x="755" y="478" class="zh note">全集 U</text>
  <text x="885" y="600" text-anchor="middle" class="zh note">U 中不属于 A 的元素</text>
</svg>

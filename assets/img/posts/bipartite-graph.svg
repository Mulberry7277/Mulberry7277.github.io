<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">二分图的两部分结构</title>
  <desc id="desc">左侧集合 X 与右侧集合 Y，所有边只跨越两部分。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.small{font-size:20px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.left{fill:#dbeafe;stroke:#3b82f6;stroke-width:3}.right{fill:#fef3c7;stroke:#d97706;stroke-width:3}.edge{stroke:#94a3b8;stroke-width:5;stroke-linecap:round}.groupx{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.groupy{fill:#fffbeb;stroke:#fcd34d;stroke-width:2}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">二分图：边只在两部分之间出现</text>
  <rect x="70" y="90" width="1060" height="455" rx="24" class="panel"/>
  <rect x="140" y="155" width="235" height="320" rx="24" class="groupx"/>
  <rect x="825" y="155" width="235" height="320" rx="24" class="groupy"/>
  <text x="257" y="195" text-anchor="middle" class="zh label">X：学生</text>
  <text x="942" y="195" text-anchor="middle" class="zh label">Y：课程</text>
  <line x1="315" y1="245" x2="885" y2="245" class="edge"/>
  <line x1="315" y1="245" x2="885" y2="325" class="edge"/>
  <line x1="315" y1="325" x2="885" y2="325" class="edge"/>
  <line x1="315" y1="325" x2="885" y2="405" class="edge"/>
  <line x1="315" y1="405" x2="885" y2="405" class="edge"/>
  <circle cx="280" cy="245" r="29" class="left"/><circle cx="280" cy="325" r="29" class="left"/><circle cx="280" cy="405" r="29" class="left"/>
  <circle cx="920" cy="245" r="29" class="right"/><circle cx="920" cy="325" r="29" class="right"/><circle cx="920" cy="405" r="29" class="right"/>
  <text x="280" y="253" text-anchor="middle" class="zh small">a</text><text x="280" y="333" text-anchor="middle" class="zh small">b</text><text x="280" y="413" text-anchor="middle" class="zh small">c</text>
  <text x="920" y="253" text-anchor="middle" class="zh small">1</text><text x="920" y="333" text-anchor="middle" class="zh small">2</text><text x="920" y="413" text-anchor="middle" class="zh small">3</text>
  <text x="600" y="515" text-anchor="middle" class="zh small">同一部分内部没有边；相连表示可以选课</text>
</svg>

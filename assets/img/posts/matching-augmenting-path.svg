<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">增广路径使匹配大小增加一</title>
  <desc id="desc">在路径 a-1-b-2 上翻转匹配边，匹配从一条边增加为两条边。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:6;stroke-linecap:round}.selected{stroke:#e07a5f;stroke-width:10;stroke-linecap:round}.node{fill:#dbeafe;stroke:#3b82f6;stroke-width:3}.ynode{fill:#fef3c7;stroke:#d97706;stroke-width:3}.arrow{fill:#4f8edb}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">增广路径：交替翻转边，匹配数增加 1</text>
  <rect x="40" y="95" width="525" height="445" rx="22" class="panel"/>
  <text x="302" y="140" text-anchor="middle" class="zh label">翻转前：1 条匹配边</text>
  <line x1="160" y1="240" x2="425" y2="240" class="edge"/><line x1="160" y1="390" x2="425" y2="240" class="edge"/><line x1="160" y1="390" x2="425" y2="390" class="edge"/>
  <line x1="160" y1="390" x2="425" y2="240" class="selected"/>
  <circle cx="160" cy="240" r="27" class="node"/><circle cx="160" cy="390" r="27" class="node"/><circle cx="425" cy="240" r="27" class="ynode"/><circle cx="425" cy="390" r="27" class="ynode"/>
  <text x="160" y="248" text-anchor="middle" class="zh small">a</text><text x="160" y="398" text-anchor="middle" class="zh small">b</text><text x="425" y="248" text-anchor="middle" class="zh small">1</text><text x="425" y="398" text-anchor="middle" class="zh small">2</text>
  <text x="302" y="474" text-anchor="middle" class="zh small">增广路径：a → 1 → b → 2</text>
  <path d="M585 315 L625 315" stroke="#4f8edb" stroke-width="8" stroke-linecap="round"/><polygon points="650,315 615,292 615,338" class="arrow"/>
  <rect x="635" y="95" width="525" height="445" rx="22" class="panel"/>
  <text x="898" y="140" text-anchor="middle" class="zh label">翻转后：2 条匹配边</text>
  <line x1="755" y1="240" x2="1020" y2="240" class="edge"/><line x1="755" y1="390" x2="1020" y2="240" class="edge"/><line x1="755" y1="390" x2="1020" y2="390" class="edge"/>
  <line x1="755" y1="240" x2="1020" y2="240" class="selected"/><line x1="755" y1="390" x2="1020" y2="390" class="selected"/>
  <circle cx="755" cy="240" r="27" class="node"/><circle cx="755" cy="390" r="27" class="node"/><circle cx="1020" cy="240" r="27" class="ynode"/><circle cx="1020" cy="390" r="27" class="ynode"/>
  <text x="755" y="248" text-anchor="middle" class="zh small">a</text><text x="755" y="398" text-anchor="middle" class="zh small">b</text><text x="1020" y="248" text-anchor="middle" class="zh small">1</text><text x="1020" y="398" text-anchor="middle" class="zh small">2</text>
  <text x="898" y="474" text-anchor="middle" class="zh small">删去 b—1，加入 a—1 与 b—2</text>
</svg>

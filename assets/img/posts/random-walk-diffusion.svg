<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">随机游走与概率扩散</title>
  <desc id="desc">随机游走从起点出发，经过多步后概率质量扩散到多个顶点。</desc>
  <defs><style>.zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:18px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:5;stroke-linecap:round}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.start{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.bar{fill:#93c5fd}.bar2{fill:#fca5a5}.arrow{stroke:#4f8edb;stroke-width:4;stroke-linecap:round}</style></defs>
  <rect width="1400" height="650" rx="28" fill="#f8fafc"/><text x="700" y="55" text-anchor="middle" class="zh title">随机游走：概率沿着网络边逐步扩散</text>
  <rect x="35" y="95" width="520" height="480" rx="22" class="panel"/><text x="295" y="140" text-anchor="middle" class="zh label">t = 0：全部概率在 s</text>
  <line x1="150" y1="300" x2="275" y2="205" class="edge"/><line x1="150" y1="300" x2="275" y2="400" class="edge"/><line x1="275" y1="205" x2="425" y2="300" class="edge"/><line x1="275" y1="400" x2="425" y2="300" class="edge"/><line x1="425" y1="300" x2="500" y2="205" class="edge"/>
  <circle cx="150" cy="300" r="34" class="start"/><circle cx="275" cy="205" r="27" class="node"/><circle cx="275" cy="400" r="27" class="node"/><circle cx="425" cy="300" r="27" class="node"/><circle cx="500" cy="205" r="27" class="node"/>
  <text x="150" y="310" text-anchor="middle" class="zh small">1</text><text x="295" y="520" text-anchor="middle" class="zh small">从 s 选择一个邻居</text>
  <rect x="595" y="95" width="370" height="480" rx="22" class="panel"/><text x="780" y="140" text-anchor="middle" class="zh label">t = 1：概率分开</text>
  <line x1="665" y1="300" x2="770" y2="225" class="edge"/><line x1="665" y1="300" x2="770" y2="375" class="edge"/><line x1="770" y1="225" x2="895" y2="300" class="edge"/><line x1="770" y1="375" x2="895" y2="300" class="edge"/>
  <circle cx="665" cy="300" r="28" class="node"/><circle cx="770" cy="225" r="28" class="start"/><circle cx="770" cy="375" r="28" class="start"/><circle cx="895" cy="300" r="28" class="node"/>
  <text x="780" y="520" text-anchor="middle" class="zh small">两个邻居各获得一部分概率</text>
  <rect x="1005" y="95" width="360" height="480" rx="22" class="panel"/><text x="1185" y="140" text-anchor="middle" class="zh label">t = 2：继续扩散</text>
  <line x1="1070" y1="300" x2="1160" y2="220" class="edge"/><line x1="1070" y1="300" x2="1160" y2="390" class="edge"/><line x1="1160" y1="220" x2="1280" y2="300" class="edge"/><line x1="1160" y1="390" x2="1280" y2="300" class="edge"/>
  <circle cx="1070" cy="300" r="26" class="node"/><circle cx="1160" cy="220" r="26" class="node"/><circle cx="1160" cy="390" r="26" class="node"/><circle cx="1280" cy="300" r="26" class="node"/>
  <rect x="1050" y="470" width="260" height="15" rx="7" class="bar2"/><rect x="1050" y="500" width="195" height="15" rx="7" class="bar"/><text x="1185" y="545" text-anchor="middle" class="zh small">多步后概率趋向稳定分布</text>
</svg>

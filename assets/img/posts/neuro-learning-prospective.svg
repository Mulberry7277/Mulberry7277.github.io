<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">反向传播与前瞻性配置的学习顺序</title>
  <desc id="desc">左侧表示反向传播先更新权重再改变神经活动，右侧表示前瞻性配置先让神经活动松弛到目标状态，再用局部预测误差更新权重。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#26344a}.h{font-size:31px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:18px}.arr{fill:none;stroke:#65758a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:9 8}</style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#65758a"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" class="t h">两种学习顺序：先改权重，还是先改神经活动？</text>
  <line x1="600" y1="98" x2="600" y2="495" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="300" y="111" text-anchor="middle" class="t l">反向传播</text>
  <text x="900" y="111" text-anchor="middle" class="t l">前瞻性配置</text>
  <rect x="60" y="150" width="190" height="82" rx="18" fill="#e2efff" stroke="#6ea8de" stroke-width="2"/>
  <text x="155" y="187" text-anchor="middle" class="t l">输入</text><text x="155" y="215" text-anchor="middle" class="t s">固定活动</text>
  <rect x="330" y="150" width="190" height="82" rx="18" fill="#fcebea" stroke="#e39a92" stroke-width="2"/>
  <text x="425" y="187" text-anchor="middle" class="t l">输出误差</text><text x="425" y="215" text-anchor="middle" class="t s">全局损失</text>
  <path d="M250 191 L326 191" class="arr" marker-end="url(#arrow)"/>
  <path d="M425 236 C425 290 155 290 155 236" class="arr dash" marker-end="url(#arrow)"/>
  <rect x="205" y="320" width="190" height="82" rx="18" fill="#fff1df" stroke="#e4ae61" stroke-width="2"/>
  <text x="300" y="357" text-anchor="middle" class="t l">权重更新</text><text x="300" y="385" text-anchor="middle" class="t s">先改参数</text>
  <path d="M425 232 C425 315 395 345 395 361" class="arr" marker-end="url(#arrow)"/>
  <path d="M205 361 C120 361 110 280 155 236" class="arr" marker-end="url(#arrow)"/>
  <text x="300" y="462" text-anchor="middle" class="t s">下一次前向活动才随权重改变</text>
  <rect x="660" y="150" width="170" height="82" rx="18" fill="#e2efff" stroke="#6ea8de" stroke-width="2"/>
  <text x="745" y="187" text-anchor="middle" class="t l">输入</text><text x="745" y="215" text-anchor="middle" class="t s">固定活动</text>
  <rect x="970" y="150" width="170" height="82" rx="18" fill="#e8f6ed" stroke="#7fbd99" stroke-width="2"/>
  <text x="1055" y="187" text-anchor="middle" class="t l">目标</text><text x="1055" y="215" text-anchor="middle" class="t s">固定输出</text>
  <rect x="795" y="305" width="210" height="82" rx="18" fill="#fff1df" stroke="#e4ae61" stroke-width="2"/>
  <text x="900" y="342" text-anchor="middle" class="t l">活动松弛</text><text x="900" y="370" text-anchor="middle" class="t s">预测编码 / 降低能量</text>
  <rect x="795" y="430" width="210" height="82" rx="18" fill="#fcebea" stroke="#e39a92" stroke-width="2"/>
  <text x="900" y="467" text-anchor="middle" class="t l">局部权重更新</text><text x="900" y="495" text-anchor="middle" class="t s">误差 × 突触前活动</text>
  <path d="M830 191 L965 191" class="arr" marker-end="url(#arrow)"/>
  <path d="M745 236 C745 280 795 280 820 305" class="arr" marker-end="url(#arrow)"/>
  <path d="M1055 236 C1055 280 1005 280 980 305" class="arr" marker-end="url(#arrow)"/>
  <path d="M900 387 L900 425" class="arr" marker-end="url(#arrow)"/>
  <text x="900" y="545" text-anchor="middle" class="t s">先产生学习后的活动状态，再把它巩固到突触</text>
</svg>

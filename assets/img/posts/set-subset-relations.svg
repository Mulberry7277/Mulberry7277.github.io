<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">元素关系与子集关系</title>
  <desc id="desc">展示 x 属于 A、单元素集合是 A 的子集，以及 A 是 B 的子集之间的区别。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <style>
      .zh { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .note { font-size: 20px; }
    </style>
  </defs>
  <rect width="1100" height="560" rx="28" fill="url(#bg)"/>
  <text x="550" y="54" text-anchor="middle" class="zh title">元素关系和子集关系不是同一种关系</text>

  <ellipse cx="560" cy="295" rx="390" ry="190" fill="#dbeafe" stroke="#5b8def" stroke-width="4"/>
  <text x="880" y="145" class="zh label">B</text>
  <ellipse cx="520" cy="310" rx="245" ry="125" fill="#dcfce7" stroke="#45a36b" stroke-width="4"/>
  <text x="720" y="245" class="zh label">A</text>
  <circle cx="435" cy="315" r="16" fill="#ef6c57"/>
  <text x="463" y="323" class="zh label">x</text>
  <circle cx="570" cy="355" r="12" fill="#6366f1"/>
  <text x="594" y="363" class="zh note">y</text>
  <circle cx="685" cy="300" r="12" fill="#6366f1"/>
  <text x="709" y="308" class="zh note">z</text>

  <rect x="70" y="110" width="265" height="82" rx="16" fill="#fff" stroke="#b8c7da" stroke-width="2"/>
  <text x="202" y="147" text-anchor="middle" class="zh label">x ∈ A</text>
  <text x="202" y="176" text-anchor="middle" class="zh note">x 是 A 的元素</text>

  <rect x="70" y="220" width="265" height="82" rx="16" fill="#fff" stroke="#b8c7da" stroke-width="2"/>
  <text x="202" y="257" text-anchor="middle" class="zh label">{x} ⊆ A</text>
  <text x="202" y="286" text-anchor="middle" class="zh note">{x} 是 A 的子集</text>

  <rect x="70" y="330" width="265" height="82" rx="16" fill="#fff" stroke="#b8c7da" stroke-width="2"/>
  <text x="202" y="367" text-anchor="middle" class="zh label">A ⊆ B</text>
  <text x="202" y="396" text-anchor="middle" class="zh note">A 的元素都在 B 中</text>

  <path d="M335 150 C385 175 405 235 430 290" fill="none" stroke="#9aa9bd" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M335 260 C370 270 395 290 425 305" fill="none" stroke="#9aa9bd" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M335 370 C390 400 420 430 470 450" fill="none" stroke="#9aa9bd" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="550" y="515" text-anchor="middle" class="zh note" fill="#53657a">“∈”比较元素和集合；“⊆”比较两个集合</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hall 条件失败示例</title>
  <desc id="desc">左侧三个顶点的共同邻域只有右侧两个顶点，因此不能给每个左侧顶点安排不同邻居。</desc>
  <defs><style>
    .zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}.small{font-size:20px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.groupx{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.groupy{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:5}.node{fill:#dbeafe;stroke:#3b82f6;stroke-width:3}.ynode{fill:#fef3c7;stroke:#d97706;stroke-width:3}.bad{fill:#b91c1c;font-weight:700}
  </style></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="zh title">Hall 条件：每一组左侧顶点都要有足够多的选择</text>
  <rect x="55" y="90" width="1090" height="455" rx="22" class="panel"/>
  <rect x="130" y="155" width="260" height="325" rx="20" class="groupx"/>
  <rect x="805" y="155" width="260" height="325" rx="20" class="groupy"/>
  <text x="260" y="195" text-anchor="middle" class="zh label">S = {a, b, c}</text>
  <text x="935" y="195" text-anchor="middle" class="zh label">N(S) = {1, 2}</text>
  <line x1="285" y1="245" x2="915" y2="275" class="edge"/>
  <line x1="285" y1="315" x2="915" y2="275" class="edge"/>
  <line x1="285" y1="315" x2="915" y2="385" class="edge"/>
  <line x1="285" y1="405" x2="915" y2="385" class="edge"/>
  <circle cx="260" cy="245" r="27" class="node"/><circle cx="260" cy="315" r="27" class="node"/><circle cx="260" cy="405" r="27" class="node"/>
  <circle cx="935" cy="275" r="27" class="ynode"/><circle cx="935" cy="385" r="27" class="ynode"/>
  <text x="260" y="253" text-anchor="middle" class="zh small">a</text><text x="260" y="323" text-anchor="middle" class="zh small">b</text><text x="260" y="413" text-anchor="middle" class="zh small">c</text>
  <text x="935" y="283" text-anchor="middle" class="zh small">1</text><text x="935" y="393" text-anchor="middle" class="zh small">2</text>
  <text x="600" y="520" text-anchor="middle" class="zh small bad">|N(S)| = 2 &lt; 3 = |S|：无法覆盖 S 中的所有顶点</text>
</svg>

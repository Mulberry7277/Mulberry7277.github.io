<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">拉普拉斯二次型与顶点状态</title>
  <desc id="desc">同一条路径上的顶点状态变化越平滑，相邻差异平方和越小。</desc>
  <defs><style>.zh{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2937}.title{font-size:31px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#94a3b8;stroke-width:6;stroke-linecap:round}.smooth{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.rough{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.box{fill:#fff7ed;stroke:#fdba74;stroke-width:2}</style></defs>
  <rect width="1200" height="650" rx="28" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" class="zh title">拉普拉斯二次型累加每条边两端的差异平方</text>
  <rect x="45" y="95" width="520" height="480" rx="22" class="panel"/><text x="305" y="140" text-anchor="middle" class="zh label">平滑状态：代价较小</text>
  <line x1="130" y1="300" x2="215" y2="300" class="edge"/><line x1="215" y1="300" x2="300" y2="300" class="edge"/><line x1="300" y1="300" x2="385" y2="300" class="edge"/><line x1="385" y1="300" x2="470" y2="300" class="edge"/>
  <circle cx="130" cy="300" r="27" class="smooth"/><circle cx="215" cy="285" r="27" class="smooth"/><circle cx="300" cy="275" r="27" class="smooth"/><circle cx="385" cy="260" r="27" class="smooth"/><circle cx="470" cy="250" r="27" class="smooth"/>
  <text x="130" y="308" text-anchor="middle" class="zh small">1</text><text x="215" y="293" text-anchor="middle" class="zh small">1.1</text><text x="300" y="283" text-anchor="middle" class="zh small">1.2</text><text x="385" y="268" text-anchor="middle" class="zh small">1.3</text><text x="470" y="258" text-anchor="middle" class="zh small">1.4</text>
  <text x="305" y="485" text-anchor="middle" class="zh small">相邻差异小，$\sum(x_i-x_j)^2$ 小</text>
  <rect x="635" y="95" width="520" height="480" rx="22" class="panel"/><text x="895" y="140" text-anchor="middle" class="zh label">剧烈变化：代价较大</text>
  <line x1="720" y1="300" x2="805" y2="300" class="edge"/><line x1="805" y1="300" x2="890" y2="300" class="edge"/><line x1="890" y1="300" x2="975" y2="300" class="edge"/><line x1="975" y1="300" x2="1060" y2="300" class="edge"/>
  <circle cx="720" cy="300" r="27" class="rough"/><circle cx="805" cy="180" r="27" class="rough"/><circle cx="890" cy="315" r="27" class="rough"/><circle cx="975" cy="170" r="27" class="rough"/><circle cx="1060" cy="300" r="27" class="rough"/>
  <text x="720" y="308" text-anchor="middle" class="zh small">0</text><text x="805" y="188" text-anchor="middle" class="zh small">2</text><text x="890" y="323" text-anchor="middle" class="zh small">0</text><text x="975" y="178" text-anchor="middle" class="zh small">2</text><text x="1060" y="308" text-anchor="middle" class="zh small">0</text>
  <text x="895" y="485" text-anchor="middle" class="zh small">相邻差异大，二次型更大</text>
</svg>
